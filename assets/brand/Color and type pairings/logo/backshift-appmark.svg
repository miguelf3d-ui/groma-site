<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Backshift" fill="none">
  <title>Backshift</title>
  <!-- The k of backshift, capped by the arrowhead that marks the wordmark.
       Drawn as paths, not text: a favicon never loads a webfont, so a <text>
       element would fall back to whatever the system happens to have. -->
  <rect width="64" height="64" rx="14" fill="#F2E7A9"/>
  <path d="M29 22V56" stroke="#16170F" stroke-width="7"/>
  <path d="M29 42 45 28" stroke="#16170F" stroke-width="7"/>
  <path d="M29 42 45 56" stroke="#16170F" stroke-width="7"/>
  <path d="M19 18 29 8 39 18" stroke="#16170F" stroke-width="7" stroke-linejoin="bevel"/>
</svg>
