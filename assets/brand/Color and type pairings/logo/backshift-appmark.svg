<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Backshift" fill="none">
  <title>Backshift</title>
  <!-- Contained variant, for favicon and app icon: the mark needs its own edge
       below about 20px, where the bare arrow loses its silhouette. -->
  <rect width="96" height="96" rx="18" fill="#F2E7A9"/>
  <path d="M60 60V22" stroke="#16170F" stroke-width="10" stroke-linecap="square"/>
  <path d="M60 60H22" stroke="#16170F" stroke-width="10" stroke-linecap="square"/>
  <path d="M44 38 60 22 76 38" stroke="#16170F" stroke-width="10" stroke-linejoin="miter"/>
  <path d="M38 44 22 60 38 76" stroke="#16170F" stroke-width="10" stroke-linejoin="miter"/>
</svg>
