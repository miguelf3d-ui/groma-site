<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Backshift">
  <title>Backshift</title>
  <!-- Contained variant, for favicons and app icons: below about 20px the bare
       arrow loses its silhouette, so it needs its own edge. -->
  <rect width="64" height="64" rx="14" fill="#F2E7A9"/>
  <path d="M40 42V16" stroke="#16170F" stroke-width="7" stroke-linecap="butt"/>
  <path d="M40 42H16" stroke="#16170F" stroke-width="7" stroke-linecap="butt"/>
  <path d="M29 27 40 16 51 27" stroke="#16170F" stroke-width="7" stroke-linejoin="bevel"/>
  <path d="M27 31 16 42 27 53" stroke="#16170F" stroke-width="7" stroke-linejoin="bevel"/>
</svg>
