<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Backshift">
  <title>Backshift</title>
  <!-- Contained variant: for favicons, app icons and any placement that needs
       its own edge. The bare mark loses presence below about 20px. -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="#0C0E10" stroke="#B8FF3C" stroke-opacity=".22" stroke-width="1.5"/>
  <path d="M32.5 18 21 32l11.5 14" stroke="#F1F3EF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 18 34.5 32 46 46" stroke="#B8FF3C" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
